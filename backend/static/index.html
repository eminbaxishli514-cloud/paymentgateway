<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Gateway Demo | Secure Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo">
          <span class="logo-icon">◆</span>
          <span class="logo-text">PayFlow</span>
        </a>
        <div class="header-actions">
          <a href="/store" class="header-link">Store</a>
          <a href="/history" class="header-link">History</a>
          <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
            <span class="theme-icon dark-icon">☀</span>
            <span class="theme-icon light-icon">☽</span>
          </button>
          <span class="header-badge">Demo</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="progress-steps">
        <div class="step active" data-step="1">
          <span class="step-num">1</span>
          <span class="step-label">Payment</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="2">
          <span class="step-num">2</span>
          <span class="step-label">Verify</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="3">
          <span class="step-num">3</span>
          <span class="step-label">Complete</span>
        </div>
      </div>

      <div class="hero">
        <h1>Secure payment checkout</h1>
      </div>

      <div class="checkout-card">
        <div class="order-summary">
          <h2>Order summary</h2>
          <input type="hidden" id="amount" name="amount" value="49.00">
          <div class="summary-row">
            <span id="orderDescription">Demo product</span>
            <span class="amount" id="displayAmount">$49.00</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span class="amount" id="displayTotal">$49.00</span>
          </div>
        </div>

        <form id="paymentForm" class="payment-form" novalidate autocomplete="off">
          <div class="form-group">
            <label>Payment method</label>
            <div class="payment-methods">
              <label class="method-option">
                <input type="radio" name="payment_method" value="card" checked>
                <span class="method-card">💳 Card</span>
              </label>
              <label class="method-option">
                <input type="radio" name="payment_method" value="paypal">
                <span class="method-card method-card-logo">
                  <img src="/static/img/paypal.svg" alt="PayPal" class="payment-logo payment-logo-paypal">
                </span>
              </label>
              <label class="method-option">
                <input type="radio" name="payment_method" value="apple_pay">
                <span class="method-card method-card-logo">
                  <img src="/static/img/apple-pay.svg" alt="Apple Pay" class="payment-logo payment-logo-apple">
                </span>
              </label>
            </div>
          </div>

          <div id="cardSection" class="card-section">
            <div class="form-group" id="savedCardGroup">
              <label for="savedCard">Saved card</label>
              <select id="savedCard" name="saved_card_id">
                <option value="">Enter new card</option>
                <option value="card_4242">Visa •••• 4242</option>
                <option value="card_5555">Mastercard •••• 5555</option>
                <option value="card_0000">Visa •••• 0000 (declines)</option>
              </select>
            </div>

            <div id="newCardFields" class="new-card-fields">
              <div class="form-group">
                <label for="cardholder">Cardholder name</label>
                <input type="text" id="cardholder" name="cardholder_name" placeholder="John Doe" autocomplete="off">
                <span class="field-error" id="cardholderError"></span>
              </div>
              <div class="form-group">
                <label for="cardNumber">Card number</label>
                <input type="text" id="cardNumber" name="card_number" placeholder="4242 4242 4242 4242" maxlength="19" autocomplete="off">
                <span class="field-error" id="cardNumberError"></span>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="expMonth">Expiry</label>
                  <div class="exp-row">
                    <input type="number" id="expMonth" name="card_exp_month" placeholder="MM" min="1" max="12">
                    <span class="exp-sep">/</span>
                    <input type="number" id="expYear" name="card_exp_year" placeholder="YY" min="24" max="30">
                  </div>
                  <span class="field-error" id="expError"></span>
                </div>
                <div class="form-group">
                  <label for="cvc">CVC</label>
                  <input type="text" id="cvc" name="card_cvc" placeholder="123" maxlength="4" autocomplete="off">
                  <span class="field-error" id="cvcError"></span>
                </div>
              </div>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="submit-btn" disabled>
            <span class="btn-text">Pay</span>
            <span class="btn-loading" aria-hidden="true">
              <span class="spinner"></span>
              Processing…
            </span>
          </button>
        </form>
      </div>

      <div id="result" class="result-card hidden" role="alert">
        <div class="result-icon" id="resultIcon"></div>
        <h3 id="resultTitle"></h3>
        <p id="resultMessage"></p>
        <p class="result-id" id="resultId"></p>
      </div>
    </main>

  </div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
