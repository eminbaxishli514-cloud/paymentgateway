<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History | PayFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo">
          <span class="logo-icon">◆</span>
          <span class="logo-text">PayFlow</span>
        </a>
        <div class="header-actions">
          <a href="/" class="header-link">Checkout</a>
          <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
            <span class="theme-icon dark-icon">☀</span>
            <span class="theme-icon light-icon">☽</span>
          </button>
          <span class="header-badge">Demo</span>
        </div>
      </div>
    </header>

    <main class="main history-main">
      <div class="hero">
        <h1>Transaction history</h1>
        <p>All payments from this session. Data resets when the server restarts.</p>
      </div>

      <div id="historyList" class="history-list">
        <!-- Filled by JS -->
      </div>

      <div id="historyEmpty" class="history-empty hidden">
        <p>No transactions yet.</p>
        <a href="/" class="submit-btn">Make a payment</a>
      </div>

      <div id="historyLoading" class="receipt-loading">
        <span class="spinner large"></span>
        <p>Loading history…</p>
      </div>
    </main>

    <footer class="footer">
      <p>This is a demonstration. No real payments are processed.</p>
    </footer>
  </div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/history.js"></script>
</body>
</html>
